<!DOCTYPE html>
<html>
    <head>
        <title>
            College Admission Form
        </title>
    </head>
    <body>
        <H3>Fill the form below :</H3>
        <form>
            <label>Email Address : </label>
            <input type="email" width="1000"><br><hr>

            <label>Password : </label>
            <input type="password"><br><hr>

            <label>Full Name : </label>
            <input type="text" name="Username"><br><hr>
            
            <label>Father's Name : </label>
            <input type="text" name="father'sname"><br><hr>
            
            <label>Mother's Name : </label>
            <input type="text" name="mother'sname"><br><hr>

            <label>Date Of Birth : </label>
            <input type="date" name="DOB"><br><hr>

            <label>Gender : </label>
            <input type="radio" name="gender" value="Male">Male
            <input type="radio" name="gender" value="Female">Female
            <input type="radio" name="gender" value="Other">Other<br><hr>

            <label>Mobile Number : </label>
            <input type="number" max="10"><br><hr>

            <label>Address : </label>
            <input type="textarea"><br><hr>

            <label>City : </label>
            <select name="city">
                <option value="default">-Select-</option>
                <option value="pune">Pune</option>
                <option value="surat">Surat</option>
            </select><br><hr>

            <label>State : </label>
            <select name="state">
                <option value="default">-Select-</option>
                <option value="maharastra">Maharastra</option>
                <option value="gujarat">Gujarat</option>
            </select><br><hr>

            <label>Pincode : </label>
            <input type="number"><br><hr>

            <label>Course : </label>
            <select name="course">
                <option value="default">-Select-</option>
                <option value="mcom">Mcom</option>
                <option value="ma">MA</option>
                <option value="mca">MCA</option>
                <option value="msc">MSc</option>
                <option value="mtech">MTech</option>
            </select><br><hr>

            <label>Pervious Qualification : </label>
            <select name="course">
                <option value="default">-Select-</option>
                <option value="bcom">Bcom</option>
                <option value="ba">BA</option>
                <option value="bca">BCA</option>
                <option value="bsc">BSc</option>
                <option value="btech">BTech</option>
            </select><br><hr>

            <label>CGPA : </label>
            <input type="number"><br><hr>

            <label>Passing Year : </label>
            <input type="number"><br><hr>

            <label>Subject Selection : </label><br>
            <input type="checkbox" value="fcc">Fundamentals of Cloud Computing<br>
            <input type="checkbox" value="wd">Web Development<br>
            <input type="checkbox" value="fds">Fundamental of Data Science <br>
            <input type="checkbox" value="ics">Introduction to Cyber Security <br><hr>

            <label>Upload Passportsize Photo</label>
            <input type="file" name="photo" ><br><hr>

            <label>Upload Marksheet</label>
            <input type="file" name="marksheet" ><br><hr>

            <label>Aadhaar/ID Number</label>
            <input type="text" name="aadhaar_no" ><br><hr>

            <label>Nationality</label>
             <select name="nationality">
                <option value="default">-Select-</option>
                <option value="indian">Indian</option>
                <option value="american">American</option>
                <option value="german">German</option>
                <option value="japanese">Japanese</option>
                <option value="spanish">Spanish</option>

            <label>Category</label>
             <select name="category">
                <option value="default">-Select-</option>
                <option value="sc">SC</option>
                <option value="st">ST</option>
                <option value="obc">OBC</option>
                <option value="ews">EWS</option>
                <option value="general">General</option>

            <label>Blood Group</label>
             <select name="blood_group">
                <option value="default">-Select-</option>
                <option value="a+">A+</option>
                <option value="a-">A-</option>
                <option value="b+">B+</option>
                <option value="b-">B-</option>
                <option value="o+">O+</option>
                <option value="o-">O-</option>
                <option value="ab+">AB+</option>
                <option value="ab-">AB-</option>


        </form>
    </body>
</html>
