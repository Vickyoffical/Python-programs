<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Appreciation App</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    :root {
        --primary: #7c3aed;
        --secondary: #06b6d4;
        --dark: #0f172a;
        --glass: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.18);
        --text: #ffffff;
        --light-text: #cbd5e1;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: linear-gradient(
            135deg,
            #0f172a,
            #111827,
            #1e1b4b,
            #0f172a
        );
        background-size: 400% 400%;
        animation: gradientMove 12s ease infinite;
        overflow: hidden;
        position: relative;
    }

    /* Animated glowing circles */
    body::before,
    body::after {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        filter: blur(80px);
        z-index: 0;
    }

    body::before {
        background: rgba(124, 58, 237, 0.4);
        top: 10%;
        left: 10%;
    }

    body::after {
        background: rgba(6, 182, 212, 0.35);
        bottom: 10%;
        right: 10%;
    }

    .login-card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 430px;
        padding: 40px 32px;
        border-radius: 24px;
        background: var(--glass);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
        text-align: center;
        animation: floatCard 4s ease-in-out infinite;
    }

    .login-card h2 {
        color: var(--text);
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .subtitle {
        color: var(--light-text);
        font-size: 0.95rem;
        margin-bottom: 28px;
    }

    .input-group {
        position: relative;
        margin-bottom: 18px;
    }

    input {
        width: 100%;
        padding: 15px 18px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 14px;
        background: rgba(255,255,255,0.05);
        color: white;
        font-size: 15px;
        outline: none;
        transition: 0.3s ease;
    }

    input::placeholder {
        color: #94a3b8;
    }

    input:focus {
        border-color: var(--secondary);
        box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.12);
        background: rgba(255,255,255,0.08);
    }

    button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        );
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.35s ease;
        box-shadow: 0 10px 25px rgba(124, 58, 237, 0.35);
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 35px rgba(6, 182, 212, 0.35);
    }

    button:active {
        transform: scale(0.98);
    }

    .footer-text {
        margin-top: 18px;
        font-size: 0.9rem;
        color: var(--light-text);
    }

    .footer-text a {
        color: var(--secondary);
        text-decoration: none;
        font-weight: 500;
    }

    .footer-text a:hover {
        text-decoration: underline;
    }

    @keyframes gradientMove {
        0% {
            background-position: 0% 50%;
        }
        50% {
            background-position: 100% 50%;
        }
        100% {
            background-position: 0% 50%;
        }
    }

    @keyframes floatCard {
        0%, 100% {
            transform: translateY(0px);
        }
        50% {
            transform: translateY(-8px);
        }
    }

    @media (max-width: 480px) {
        .login-card {
            padding: 30px 22px;
        }

        .login-card h2 {
            font-size: 1.7rem;
        }
    }
</style>
</head>

<body>

<div class="login-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to continue your journey</p>

    <form action="/reveal" method="post">

        <div class="input-group">
            <input 
                type="text" 
                name="username" 
                placeholder="Enter your username" 
                required
            >
        </div>

        <div class="input-group">
            <input 
                type="password" 
                name="password" 
                placeholder="Enter your password" 
                required
            >
        </div>

        <button type="submit">Login</button>

    </form>
</div>

</body>
</html>
